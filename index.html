// Aplica DADOS_DO_SITE ao catálogo atual: preenche a capa da ficha (se ainda não tiver)
// e o preço de exemplares já possuídos que estejam sem preço registrado.
// Roda toda vez que a página abre, então funciona tanto pra quem já vinha usando a
// ferramenta quanto pra quem está abrindo pela primeira vez.
(function aplicarDadosDoSite(){
  let catalogoMudou = false;
  let volumesMudou = false;
  for (const idStr in DADOS_DO_SITE) {
    const id = Number(idStr);
    const dados = DADOS_DO_SITE[idStr];
    const manga = catalogo.find(m => m.id === id);
    if (!manga) continue;
    if (dados.capas && !manga.capas) {
      manga.capas = dados.capas;
      catalogoMudou = true;
    }
    if (dados.precos) {
      volumes.forEach(v => {
        if (v.mangaId === id && (v.preco === null || v.preco === undefined) && dados.precos[v.volume] != null) {
          v.preco = dados.precos[v.volume];
          volumesMudou = true;
        }
      });
    }
  }
  if (catalogoMudou) saveCat();
  if (volumesMudou) saveVol();
})();

// Migração: estante/prateleira eram registradas por volume, mas fazem mais sentido
// por título (a coleção inteira costuma ficar no mesmo lugar). Roda uma vez: pra cada
// mangá sem estante/prateleira definida na ficha, deriva o valor mais comum entre os
// volumes que ele já tinha e aplica na ficha. Não apaga os dados antigos dos volumes
// (inofensivos, só não são mais exibidos/editados por lá).
(function migrarEstantePrateleira(){
  let mudou = false;
  for (const manga of catalogo) {
    if (manga.estante != null && manga.prateleira != null) continue;
    const vols = volumes.filter(v => v.mangaId === manga.id);
    if (vols.length === 0) continue;
    const contar = (campo) => {
      const contagem = {};
      for (const v of vols) {
        if (v[campo] == null || v[campo] === "") continue;
        const chave = String(v[campo]);
        contagem[chave] = (contagem[chave] || 0) + 1;
      }
      let melhor = null, max = 0;
      for (const chave in contagem) {
        if (contagem[chave] > max) { max = contagem[chave]; melhor = chave; }
      }
      return melhor;
    };
    if (manga.estante == null) {
      const v = contar("estante");
      if (v != null) { manga.estante = v; mudou = true; }
    }
    if (manga.prateleira == null) {
      const v = contar("prateleira");
      if (v != null) { manga.prateleira = v; mudou = true; }
    }
  }
  if (mudou) saveCat();
})();

function normalize(str){
  return (str||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function statusTone(status){
  const s = normalize(status);
  if (s.includes("conclu")) return {fg:"#3B5D3A", bg:"#E3EBD8"};
  if (s.includes("andamento")) return {fg:"#8A5A22", bg:"#F1E3C6"};
  if (s.includes("pausa")) return {fg:"#6B4A8A", bg:"#E7DCF0"};
  if (s.includes("cancel")) return {fg:"#A13328", bg:"#F1DAD5"};
  return {fg:"#5B4636", bg:"#E9E1CE"};
}

function renderAcervoList(){
  const search = window.__search || "";
  const filtroStatus = window.__filtroStatus || "";
  const filtroEditora = window.__filtroEditora || "";
  const filtroTipo = window.__filtroTipo || "";
  const q = normalize(search);
  let list = catalogo;
  if (q) list = list.filter(m => normalize(m.nome).includes(q) || normalize(m.editora).includes(q));
  if (filtroStatus) list = list.filter(m => m.statusCompra === filtroStatus);
  if (filtroEditora) list = list.filter(m => m.editora === filtroEditora);
  if (filtroTipo) list = list.filter(m => m.tipo === filtroTipo);
  list = [...list].sort((a,b)=>normalize(a.nome).localeCompare(normalize(b.nome)));

  const editorasUnicas = Array.from(new Set(catalogo.map(m=>m.editora).filter(Boolean))).sort((a,b)=>normalize(a).localeCompare(normalize(b)));
  const tiposUnicos = Array.from(new Set(catalogo.map(m=>m.tipo).filter(Boolean))).sort((a,b)=>normalize(a).localeCompare(normalize(b)));

  let html = `<input id="searchInput" placeholder="Buscar por título ou editora…" value="${esc(search)}" style="margin-bottom:10px;">`;

  html += `<div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">`;
  html += `<select id="filtroStatus" style="flex:1; min-width:110px; font-size:12.5px; padding:7px 8px;">
    <option value="">Coleção: todos</option>
    ${STATUS_OPCOES.map(s=>`<option value="${esc(s)}"${filtroStatus===s?' selected':''}>${esc(s)}</option>`).join("")}
  </select>`;
  html += `<select id="filtroEditora" style="flex:1; min-width:110px; font-size:12.5px; padding:7px 8px;">
    <option value="">Editora: todas</option>
    ${editorasUnicas.map(e=>`<option value="${esc(e)}"${filtroEditora===e?' selected':''}>${esc(e)}</option>`).join("")}
  </select>`;
  html += `<select id="filtroTipo" style="flex:1; min-width:110px; font-size:12.5px; padding:7px 8px;">
    <option value="">Tipo: todos</option>
    ${tiposUnicos.map(t=>`<option value="${esc(t)}"${filtroTipo===t?' selected':''}>${esc(t)}</option>`).join("")}
  </select>`;
  html += `</div>`;

  if (filtroStatus || filtroEditora || filtroTipo) {
    html += `<button type="button" id="limparFiltros" class="small-btn mono" style="margin-left:0; margin-bottom:10px;">✕ Limpar filtros</button>`;
  }

  html += `<div class="mono" style="font-size:11px; color:#8A7A57; margin-bottom:8px;">${list.length} título${list.length===1?"":"s"} encontrado${list.length===1?"":"s"}</div>`;

  if (list.length===0){
    html += `<div class="empty mono">${catalogo.length===0 ? "Nenhum manga cadastrado ainda. Use a aba \"+ Cadastrar manga\" para começar." : "Nenhum título encontrado com esses filtros."}</div>`;
  }
  for (const m of list){
    const owned = volumesByManga(m.id);
    const uniqueOwned = new Set(owned.map(v=>v.volume)).size;

    html += `<div class="stamp-grid">`;

      const capaUrl = manga.capas && manga.capas[n];
      const inner = capaUrl ? `<img src="${esc(capaUrl)}" alt="Capa do volume ${n}" loading="lazy">` : n;
      html += `<button type="button" class="stamp mono${ownedSet.has(n)?" filled":""}${activeVolume===n?" active":""}${capaUrl?" has-cover":""}" data-vol="${n}" title="Volume ${n}">${inner}</button>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="empty mono">Nenhum volume registrado ainda. Preencha o total de volumes na ficha do mangá para liberar a grade, ou use a aba "+ Registrar volume".</div>`;
  }

  if (activeVolume !== null){
    html += renderVolumePanel(manga, owned.filter(v=>Number(v.volume)===activeVolume));
  }

  if (owned.some(v=>v.preco||v.obs)){
    html += `<div style="margin-top:18px;"><div class="section-label mono">Detalhes dos exemplares</div><div style="max-height:220px; overflow-y:auto;">`;
    const sorted = [...owned].sort((a,b)=>(a.volume||0)-(b.volume||0));
    for (const v of sorted){
      html += `<div class="exemplar-line mono">Vol. ${v.volume}${v.preco?` · R$ ${Number(v.preco).toFixed(2)}`:""}${v.variante?` · ${esc(v.variante)}`:""}${v.obs?` · ${esc(v.obs)}`:""}</div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

function renderVolumePanel(manga, exemplares){
  if (volumeFormTarget === undefined) volumeFormTarget = null;
  if (exemplares.length === 0 && volumeFormTarget === null) volumeFormTarget = "new";

  let html = `<div class="vol-panel">`;
  html += `<div class="vol-panel-head"><div class="vol-panel-title">Volume ${activeVolume}</div>
    <button type="button" class="small-btn" id="volPanelClose">Fechar</button></div>`;

  const capaUrl = manga.capas && manga.capas[activeVolume];
  if (capaUrl) {
    html += `<img class="cover-big" src="${esc(capaUrl)}" alt="Capa do volume ${activeVolume}">`;
  }

  if (exemplares.length > 0 && volumeFormTarget === null){
    html += `<div style="margin-bottom:10px;">`;
    for (const ex of exemplares){
      html += `<div class="vol-row mono">
        <div>${ex.preco?`R$ ${Number(ex.preco).toFixed(2)}`:"sem preço"}${ex.variante?` · ${esc(ex.variante)}`:""}${ex.obs?` · ${esc(ex.obs)}`:""}</div>
        <div style="flex-shrink:0; white-space:nowrap;">

        </div>
      </div>`;
    }
    html += `<button type="button" class="small-btn block mono" id="volPanelNew">+ Adicionar outro exemplar deste volume</button>`;
    html += `</div>`;
  }

  if (volumeFormTarget !== null){
    let ex = null;
    if (volumeFormTarget !== "new") ex = exemplares.find(e=>e.id===volumeFormTarget) || null;
    const precoRef = manga.precosRef && manga.precosRef[activeVolume];
    const vPreco = ex && ex.preco!=null ? ex.preco : (volumeFormTarget==="new" && precoRef!=null ? precoRef : "");
    const vVariante = ex && ex.variante ? ex.variante : "";
    const vObs = ex && ex.obs ? ex.obs : "";
    const vCapa = capaUrl || "";
    html += `<form id="volPanelForm">
      <label><div class="flabel mono">Link da capa (URL)</div><input id="vp_capa" value="${esc(vCapa)}" placeholder="https://…"></label>
      <label><div class="flabel mono">Preço (R$)</div><input id="vp_preco" value="${esc(vPreco)}" placeholder="Ex: 24.90"></label>
      <label><div class="flabel mono">Variante / repetido</div><input id="vp_variante" value="${esc(vVariante)}" placeholder="Opcional"></label>
      <label><div class="flabel mono">Observação</div><input id="vp_obs" value="${esc(vObs)}" placeholder="Opcional"></label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="submit" class="btn-primary mono" style="flex:1;">${volumeFormTarget==="new" ? `Adicionar volume ${activeVolume}` : "Salvar alterações"}</button>
        ${exemplares.length>0 ? `<button type="button" class="small-btn" id="volPanelCancel" style="margin-left:0;">Cancelar</button>` : ""}
      </div>
      ${volumeFormTarget==="new" ? `<button type="button" class="small-btn block mono" id="volPanelSoCapa" style="margin-top:8px;">Salvar capa e preço (ainda não tenho este volume)</button>` : ""}
    </form>`;
  }

  html += `</div>`;
  return html;
}

function wireVolumePanel(manga){
  const closeBtn = document.getElementById("volPanelClose");
  if (closeBtn) closeBtn.addEventListener("click", ()=>{ activeVolume=null; volumeFormTarget=null; render(); });

  document.querySelectorAll("[data-edit-ex]").forEach(b=>{
    b.addEventListener("click", ()=>{ volumeFormTarget = Number(b.dataset.editEx); render(); });
  });
  document.querySelectorAll("[data-del-ex]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = Number(b.dataset.delEx);
      const target = volumes.find(v=>v.id===id);
      if (window.confirm(`Remover este exemplar do volume ${activeVolume}?`)){
        volumes = volumes.filter(v=>v.id!==id);
        saveVol();
        showToast(target ? `Exemplar do volume ${target.volume} removido.` : "Exemplar removido.");
        // Fecha o painel na hora para o carimbo atualizado aparecer visível na grade.
        activeVolume = null; volumeFormTarget = null;
        render();
      }
    });
  });
  const newBtn = document.getElementById("volPanelNew");
  if (newBtn) newBtn.addEventListener("click", ()=>{ volumeFormTarget = "new"; render(); });
  const cancelBtn = document.getElementById("volPanelCancel");
  if (cancelBtn) cancelBtn.addEventListener("click", ()=>{ volumeFormTarget = null; render(); });

  const soCapaBtn = document.getElementById("volPanelSoCapa");
  if (soCapaBtn) soCapaBtn.addEventListener("click", ()=>{
    const capaUrlInput = document.getElementById("vp_capa").value.trim();
    const precoInput = document.getElementById("vp_preco").value.trim();
    if (!capaUrlInput && !precoInput){
      showToast("Preencha a capa e/ou o preço antes de salvar.");
      return;
    }
    let mudou = false;
    if (capaUrlInput) {
      if (!manga.capas) manga.capas = {};
      manga.capas[activeVolume] = capaUrlInput;
      mudou = true;
    }
    if (precoInput) {
      if (!manga.precosRef) manga.precosRef = {};
      manga.precosRef[activeVolume] = Number(precoInput);
      mudou = true;
    }
    if (mudou) saveCat();
    showToast(`Informações do volume ${activeVolume} salvas (sem adicionar à sua coleção).`);
    activeVolume = null; volumeFormTarget = null;
    render();
  });

  const form = document.getElementById("volPanelForm");
  if (form) form.addEventListener("submit", (e)=>{
    e.preventDefault();
    const capaUrlInput = document.getElementById("vp_capa").value.trim();
    const preco = document.getElementById("vp_preco").value;
    const variante = document.getElementById("vp_variante").value.trim();
    const obs = document.getElementById("vp_obs").value.trim();
    const data = {
      mangaId: manga.id,
      volume: activeVolume,
      preco: preco ? Number(preco) : null,
      variante, obs,
    };
    let isNew = false;
    if (volumeFormTarget !== "new"){
      data.id = volumeFormTarget;
      volumes = volumes.map(v=> v.id===data.id ? {...v, ...data} : v);
      showToast(`Volume ${activeVolume} atualizado.`);
    } else {
      isNew = true;
      data.id = nextVolumeId();
      volumes = [...volumes, data];
      showToast(`Volume ${activeVolume} registrado.`);
    }
    saveVol();
    let catalogoMudou = false;
    if (isNew && (!manga.statusCompra || normalize(manga.statusCompra).includes("nao iniciado"))){
      manga.statusCompra = "Em andamento";
      catalogoMudou = true;
    }
    // Salva o link da capa desse volume específico na ficha do mangá (não no exemplar,
    // já que a capa é a mesma pra qualquer cópia física do mesmo volume).
    if (capaUrlInput) {
      if (!manga.capas) manga.capas = {};
      if (manga.capas[activeVolume] !== capaUrlInput) {
        manga.capas[activeVolume] = capaUrlInput;
        catalogoMudou = true;
      }
    }
    if (catalogoMudou) saveCat();
    // Fecha o painel na hora para o carimbo atualizado aparecer visível na grade —
    // sem isso, a confirmação ficava escondida dentro do painel aberto.
    activeVolume = null; volumeFormTarget = null;
    render();
  });
}

// Select com opção "Outro": ao escolher "Outro", vira um campo de texto livre.
// O valor digitado passa a aparecer como opção normal nas próximas vezes,
// porque dynamicOptions é derivado dos valores já usados no acervo.
function selectWithCustom(id,label,baseOptions,dynamicOptions,selectedValue){
  const used = (dynamicOptions||[]).filter(o=>o && !baseOptions.includes(o) && o!=="Outro");
  const options = [...baseOptions.filter(o=>o!=="Outro"), ...used.sort((a,b)=>a.localeCompare(b)), "Outro"];
  const isCustomValue = selectedValue && !options.includes(selectedValue);
  let opts = `<option value="">Selecione…</option>` + options.map(o=>`<option value="${esc(o)}"${o===selectedValue?' selected':''}>${esc(o)}</option>`).join("");
  return `<div style="margin-bottom:14px;">
    <div class="flabel mono">${label}</div>
    <select id="f_${id}_select" style="${isCustomValue?'display:none;':''}">${opts}</select>
    <div id="f_${id}_customWrap" style="display:${isCustomValue?'flex':'none'}; gap:6px;">
      <input id="f_${id}_custom" value="${isCustomValue?esc(selectedValue):''}" placeholder="Digite e será adicionado às opções…" style="flex:1;">
      <button type="button" id="f_${id}_cancel" class="mono" style="flex-shrink:0; font-size:13px; color:#8A7A57; background:#FBF8F0; border:1px solid #C9B98A; border-radius:4px; padding:0 12px; cursor:pointer;">✕</button>
    </div>
  </div>`;
}
function wireSelectWithCustom(id){

  const custom = document.getElementById(`f_${id}_custom`);
  const cancel = document.getElementById(`f_${id}_cancel`);
  select.addEventListener("change", ()=>{
    if (select.value === "Outro"){

  nomeInput.addEventListener("input", ()=>{
    const found = catalogo.find(m=>normalize(m.nome)===normalize(nomeInput.value));
    document.getElementById("volHint").style.display = (nomeInput.value && !found) ? "block" : "none";
  });
  document.getElementById("volForm").addEventListener("submit",(e)=>{
    e.preventDefault();
    const found = catalogo.find(m=>normalize(m.nome)===normalize(nomeInput.value));
    const volumeVal = document.getElementById("f_volume").value;
    if (!found){ document.getElementById("volError").textContent = "Selecione um título já cadastrado no acervo."; return; }
    if (!volumeVal){ document.getElementById("volError").textContent = "Informe o número do volume."; return; }
    const novo = {
      mangaId: found.id,
      volume: Number(volumeVal),
      preco: document.getElementById("f_preco").value ? Number(document.getElementById("f_preco").value) : null,
      variante: document.getElementById("f_variante").value.trim(),
      obs: document.getElementById("f_obs").value.trim(),
    };
    volumes.push(novo); saveVol();

    // Se o mangá estava "Não iniciado" (ou sem status de coleção), o primeiro volume
    // registrado já indica que a coleção começou.
    if (!found.statusCompra || normalize(found.statusCompra).includes("nao iniciado")) {
      found.statusCompra = "Em andamento";
      saveCat();
    }

    showToast(`Volume ${novo.volume} registrado.`);
    selectedId = found.id;
    setTab("acervo");
  });
}

function toCSV(rows, headers){
  const escape = (v)=>{
    if (v===null||v===undefined) return "";
    const s = String(v);
    if (s.includes(",")||s.includes('"')||s.includes("\n")) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  const lines = [headers.map(h=>h.label).join(",")];
  for (const row of rows) lines.push(headers.map(h=>escape(row[h.key])).join(","));
  return lines.join("\n");
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function renderEstatisticas(){
  const titulosComVolumes = new Set(volumes.map(v=>v.mangaId)).size;
  const totalVolumes = volumes.length;
  const volumesUnicos = new Set(volumes.map(v=>`${v.mangaId}-${v.volume}`)).size;

  let valorTotalCapa = 0;
  let volumesComPreco = 0;
  for (const v of volumes){
    if (v.preco != null){ valorTotalCapa += Number(v.preco); volumesComPreco++; }
  }
  const precoMedio = volumesComPreco ? valorTotalCapa / volumesComPreco : 0;

  const idsComVolumes = new Set(volumes.map(v=>v.mangaId));
  function contarPor(campo){
    const map = {};
    for (const m of catalogo){
      if (!idsComVolumes.has(m.id)) continue;
      const chave = m[campo] || "—";
      map[chave] = (map[chave]||0) + 1;
    }
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }
  const porStatus = contarPor("statusCompra");
  const porEditora = contarPor("editora");
  const porTipo = contarPor("tipo");
  const porIdioma = contarPor("idioma");

  // Título com mais volumes possuídos
  const volumesPorManga = {};
  for (const v of volumes){
    volumesPorManga[v.mangaId] = (volumesPorManga[v.mangaId]||0) + 1;
  }
  let maiorColecao = null, maiorColecaoQtd = 0;
  for (const idStr in volumesPorManga){
    if (volumesPorManga[idStr] > maiorColecaoQtd){
      maiorColecaoQtd = volumesPorManga[idStr];
      maiorColecao = catalogo.find(m=>m.id===Number(idStr));
    }
  }

  // Valor (preço de capa) por título
  const valorPorManga = {};
  for (const v of volumes){
    if (v.preco != null) valorPorManga[v.mangaId] = (valorPorManga[v.mangaId]||0) + Number(v.preco);
  }
  let maiorValor = null, maiorValorTotal = 0;
  for (const idStr in valorPorManga){
    if (valorPorManga[idStr] > maiorValorTotal){
      maiorValorTotal = valorPorManga[idStr];
      maiorValor = catalogo.find(m=>m.id===Number(idStr));
    }
  }

  // Coleções completas (volumesTotal definido e todos os volumes possuídos)
  let colecoesCompletas = 0;
  for (const m of catalogo){
    if (!m.volumesTotal) continue;
    const owned = new Set(volumesByManga(m.id).map(v=>v.volume)).size;
    if (owned >= m.volumesTotal) colecoesCompletas++;
  }

  function barra(label, valor, total, extra){
    const pct = total ? Math.round((valor/total)*100) : 0;
    return `<div style="margin-bottom:8px;">
      <div class="mono" style="font-size:12px; color:#2B2118; display:flex; justify-content:space-between;">
        <span>${esc(label)}</span><span>${valor}${extra||""}</span>
      </div>
      <div style="height:6px; background:#E3D6AC; border-radius:3px; overflow:hidden; margin-top:3px;">
        <div style="height:100%; width:${pct}%; background:#A13328;"></div>
      </div>
    </div>`;
  }

  function cartaoNumero(label, valor){
    return `<div style="flex:1; min-width:110px; background:#FBF8F0; border:1px solid #C9B98A; border-radius:6px; padding:12px; text-align:center;">
      <div style="font-family:Georgia, serif; font-size:22px; font-weight:700; color:#2B2118;">${valor}</div>
      <div class="mono" style="font-size:10px; color:#8A7A57; text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;">${esc(label)}</div>
    </div>`;
  }

  let html = `<div class="form-title">Estatísticas do acervo</div>`;

  html += `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;">`;
  html += cartaoNumero("Títulos com volumes", titulosComVolumes);
  html += cartaoNumero("Volumes possuídos", volumesUnicos);
  html += cartaoNumero("Coleções completas", colecoesCompletas);
  html += cartaoNumero("Valor total (capa)", `R$ ${valorTotalCapa.toFixed(2)}`);
  html += `</div>`;

  html += `<div class="mono" style="font-size:11px; color:#8A7A57; margin-bottom:16px; line-height:1.6;">
    Títulos catalogados no total (com ou sem volume registrado): <strong>${catalogo.length}</strong><br>
    Preço médio por volume (dos que têm preço registrado): <strong>R$ ${precoMedio.toFixed(2)}</strong><br>
    Exemplares registrados no total (contando repetidos/variantes): <strong>${totalVolumes}</strong><br>
    "Valor total (capa)" é a soma do preço de capa/lançamento de cada exemplar registrado — não necessariamente o que você pagou (promoções, sebo etc. não entram nessa conta).
  </div>`;

  if (maiorColecao){
    html += `<div class="mono" style="font-size:11.5px; color:#5B4636; margin-bottom:6px;">📚 Maior coleção: <strong>${esc(maiorColecao.nome)}</strong> (${maiorColecaoQtd} exemplares)</div>`;
  }
  if (maiorValor){
    html += `<div class="mono" style="font-size:11.5px; color:#5B4636; margin-bottom:16px;">💰 Maior valor (capa) num só título: <strong>${esc(maiorValor.nome)}</strong> (R$ ${maiorValorTotal.toFixed(2)})</div>`;
  }

  html += `<div class="section-label mono">Por status da coleção (títulos com volumes)</div>`;
  for (const [k,v] of porStatus) html += barra(k, v, titulosComVolumes);

  html += `<div class="section-label mono" style="margin-top:16px;">Por editora (top 8)</div>`;
  for (const [k,v] of porEditora.slice(0,8)) html += barra(k, v, titulosComVolumes);

  html += `<div class="section-label mono" style="margin-top:16px;">Por tipo</div>`;
  for (const [k,v] of porTipo.slice(0,8)) html += barra(k, v, titulosComVolumes);

  html += `<div class="section-label mono" style="margin-top:16px;">Por idioma</div>`;
  for (const [k,v] of porIdioma) html += barra(k, v, titulosComVolumes);

  return html;
}

function renderExportar(){
  let html = `<div class="form-title">Retirar cópia do fichário</div>`;
  html += `<div class="mono" style="font-size:11.5px; color:#8A7A57; margin-bottom:18px; line-height:1.5;">
    Baixe os arquivos para abrir no computador ou celular — os CSVs abrem em Excel, Google Sheets ou Numbers.
    O backup em JSON serve para guardar uma cópia completa.</div>`;
  html += `<button class="btn-secondary mono" id="expCat">⬇ Baixar acervo (CSV) — ${catalogo.length} títulos</button>`;
  html += `<button class="btn-secondary mono" id="expVol">⬇ Baixar volumes comprados (CSV) — ${volumes.length} exemplares</button>`;
  html += `<button class="btn-secondary mono" id="expJson" style="background:#A13328; color:#F7F2E7; border:none; font-weight:700;">⬇ Baixar backup completo (JSON)</button>`;

  html += `<div class="form-title" style="margin-top:22px;">Importar backup</div>`;
  html += `<div class="mono" style="font-size:11.5px; color:#8A7A57; margin-bottom:12px; line-height:1.5;">
    Escolha um arquivo de backup (.json) exportado anteriormente. Isso substitui todos os dados atuais deste fichário.</div>`;
  html += `<input type="file" id="importFile" accept="application/json,.json" style="display:none;">`;
  html += `<button class="btn-secondary mono" id="importBtn" style="border-style:dashed;">⬆ Escolher arquivo de backup (.json)</button>`;
  html += `<div id="importError" class="mono" style="color:#A13328; font-size:11.5px; margin-top:6px;"></div>`;

  html += `<div class="footnote mono">Estes dados ficam salvos apenas neste navegador, neste dispositivo. Para levar para outro aparelho, use os botões acima.</div>`;
  return html;
}
function wireExportar(){
  document.getElementById("expCat").addEventListener("click", ()=>{
    const csv = toCSV(catalogo, [
      {key:"id",label:"Codigo"},{key:"nome",label:"Nome"},{key:"editora",label:"Editora"},
      {key:"tipo",label:"Tipo"},{key:"idioma",label:"Idioma"},{key:"status",label:"Status"},
      {key:"volumesTotal",label:"Volumes"},{key:"estante",label:"Estante"},{key:"prateleira",label:"Prateleira"},{key:"site",label:"Site"},
    ]);
    downloadFile("acervo-mangas.csv", csv, "text/csv;charset=utf-8");
  });
  document.getElementById("expVol").addEventListener("click", ()=>{
    const byId = {}; catalogo.forEach(m=>byId[m.id]=m.nome);
    const rows = volumes.map(v=>({...v, nome: byId[v.mangaId]||""}));
    const csv = toCSV(rows, [
      {key:"mangaId",label:"Codigo"},{key:"nome",label:"Nome"},{key:"volume",label:"Volume"},
      {key:"preco",label:"Preco"},
      {key:"variante",label:"Variante"},{key:"obs",label:"Observacao"},
    ]);
    downloadFile("volumes-comprados.csv", csv, "text/csv;charset=utf-8");
  });
  document.getElementById("expJson").addEventListener("click", ()=>{
    const backup = {catalogo, volumes, exportadoEm: new Date().toISOString()};
    downloadFile("backup-acervo-mangas.json", JSON.stringify(backup,null,2), "application/json");
  });
  document.getElementById("importBtn").addEventListener("click", ()=>{
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const errBox = document.getElementById("importError");
    errBox.textContent = "";
    const reader = new FileReader();
    reader.onload = () => {
      let backup;
      try {
        backup = JSON.parse(reader.result);
      } catch (err) {
        errBox.textContent = "Não consegui ler esse arquivo — confira se é o JSON exportado daqui.";
        return;
      }
      if (!backup || !Array.isArray(backup.catalogo) || !Array.isArray(backup.volumes)) {
        errBox.textContent = "Arquivo de backup inválido.";
        return;
      }
      const confirmMsg = `Importar vai SUBSTITUIR os dados atuais (${catalogo.length} títulos, ${volumes.length} volumes) `+
        `pelos do backup (${backup.catalogo.length} títulos, ${backup.volumes.length} volumes). Continuar?`;
      if (window.confirm(confirmMsg)) {
        catalogo = backup.catalogo;
        volumes = backup.volumes;
        saveCat(); saveVol();
        showToast(`Backup importado: ${catalogo.length} títulos, ${volumes.length} volumes.`);
        setTab("acervo");
      }
    };
    reader.readAsText(file);
  });
}
